<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Application status state machine</title>
  <desc id="d1">Legal transitions between application states. Illegal transitions are rejected at the boundary.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2c3e50"/>
    </marker>
    <marker id="arr-rej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#999"/>
    </marker>
  </defs>

  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <!-- Nodes -->
    <circle cx="90" cy="140" r="42" fill="#fff" stroke="#cfd3d8" stroke-width="1.5"/>
    <text x="90" y="138" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a" font-weight="600">applied</text>

    <circle cx="240" cy="140" r="42" fill="#fff" stroke="#cfd3d8" stroke-width="1.5"/>
    <text x="240" y="138" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a" font-weight="600">screening</text>

    <circle cx="400" cy="140" r="42" fill="#fff" stroke="#cfd3d8" stroke-width="1.5"/>
    <text x="400" y="138" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a" font-weight="600">interview</text>

    <circle cx="560" cy="80" r="42" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
    <text x="560" y="78" text-anchor="middle" dominant-baseline="central" fill="#2c3e50" font-weight="700">offer</text>

    <circle cx="560" cy="220" r="42" fill="#fff" stroke="#cfd3d8" stroke-width="1.5"/>
    <text x="560" y="218" text-anchor="middle" dominant-baseline="central" fill="#666" font-weight="600">rejected</text>
  </g>

  <!-- Forward transitions -->
  <g stroke="#2c3e50" stroke-width="1.5" fill="none">
    <line x1="132" y1="140" x2="198" y2="140" marker-end="url(#arr)"/>
    <line x1="282" y1="140" x2="358" y2="140" marker-end="url(#arr)"/>
    <line x1="430" y1="115" x2="528" y2="90" marker-end="url(#arr)"/>
  </g>

  <!-- Terminal transitions to rejected (any state can be rejected) -->
  <g stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M 110 100 Q 280 30 530 200" marker-end="url(#arr-rej)"/>
    <path d="M 270 175 Q 400 250 528 220" marker-end="url(#arr-rej)"/>
  </g>

  <!-- Legend -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#666">
    <line x1="60" y1="240" x2="100" y2="240" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="108" y="244">legal transition</text>
    <line x1="240" y1="240" x2="280" y2="240" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="288" y="244">rejection (any state)</text>
  </g>
</svg>

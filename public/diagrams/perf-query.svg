<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Slow query optimization: 30s to ~2s</title>
  <desc id="d1">Before: full scan with N+1 lookups and a permissive JOIN. After: composite index, eager loading, conditional JOIN — ~15x faster on the same dataset.</desc>

  <!-- Header -->
  <text x="360" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Same dataset, same volume clinic — two query plans</text>
  <line x1="40" y1="50" x2="680" y2="50" stroke="#cfd3d8" stroke-width="1"/>

  <!-- Before column -->
  <text x="180" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#666">Before</text>
  <rect x="60" y="95" width="240" height="190" rx="6" fill="#fff" stroke="#cfd3d8" stroke-width="1.5"/>
  <text x="80" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">SELECT *</text>
  <text x="80" y="145" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">FROM appointments a</text>
  <text x="80" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">JOIN patients p</text>
  <text x="80" y="185" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">JOIN clinicians c</text>
  <text x="80" y="205" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">-- per-row permission</text>
  <text x="80" y="225" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">-- lookup (N+1)</text>

  <line x1="80" y1="240" x2="280" y2="240" stroke="#cfd3d8" stroke-width="1"/>
  <text x="180" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#666">scan ~14,000 rows · 30s+</text>

  <!-- Arrow -->
  <line x1="320" y1="180" x2="400" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2c3e50">~15×</text>

  <!-- After column -->
  <text x="540" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2c3e50">After</text>
  <rect x="420" y="95" width="240" height="190" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text x="440" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">SELECT &lt;cols&gt;</text>
  <text x="440" y="145" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">FROM appointments a</text>
  <text x="440" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">LEFT JOIN patients p ON …</text>
  <text x="440" y="185" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">WHERE a.date = ?</text>
  <text x="440" y="205" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">-- eager-load perms</text>
  <text x="440" y="225" font-family="JetBrains Mono, monospace" font-size="11" fill="#1a1a1a">-- composite index</text>

  <line x1="440" y1="240" x2="640" y2="240" stroke="#cfd3d8" stroke-width="1"/>
  <text x="540" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2c3e50">scan ~1,600 rows · ~2s (−88% rows)</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
